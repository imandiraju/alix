<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="heroGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="heroGrad2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="heroGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Large abstract geometric backdrop shapes -->
  <circle cx="650" cy="120" r="180" fill="#7C3AED" opacity="0.04"/>
  <circle cx="180" cy="320" r="140" fill="#06B6D4" opacity="0.04"/>

  <!-- Central network/constellation of connected nodes representing interactive learning -->
  <!-- Connection lines -->
  <line x1="400" y1="180" x2="280" y2="120" stroke="url(#heroGrad1)" stroke-width="1.5" opacity="0.4"/>
  <line x1="400" y1="180" x2="520" y2="100" stroke="url(#heroGrad1)" stroke-width="1.5" opacity="0.4"/>
  <line x1="400" y1="180" x2="340" y2="280" stroke="url(#heroGrad2)" stroke-width="1.5" opacity="0.4"/>
  <line x1="400" y1="180" x2="500" y2="260" stroke="url(#heroGrad2)" stroke-width="1.5" opacity="0.4"/>
  <line x1="280" y1="120" x2="180" y2="160" stroke="url(#heroGrad1)" stroke-width="1" opacity="0.3"/>
  <line x1="520" y1="100" x2="620" y2="140" stroke="url(#heroGrad1)" stroke-width="1" opacity="0.3"/>
  <line x1="340" y1="280" x2="240" y2="320" stroke="url(#heroGrad2)" stroke-width="1" opacity="0.3"/>
  <line x1="500" y1="260" x2="600" y2="300" stroke="url(#heroGrad2)" stroke-width="1" opacity="0.3"/>
  <line x1="280" y1="120" x2="340" y2="280" stroke="#1E1B4B" stroke-width="1" opacity="0.15"/>
  <line x1="520" y1="100" x2="500" y2="260" stroke="#1E1B4B" stroke-width="1" opacity="0.15"/>
  <line x1="180" y1="160" x2="120" y2="220" stroke="#06B6D4" stroke-width="1" opacity="0.2"/>
  <line x1="620" y1="140" x2="680" y2="200" stroke="#06B6D4" stroke-width="1" opacity="0.2"/>
  <line x1="240" y1="320" x2="180" y2="350" stroke="#F97316" stroke-width="1" opacity="0.2"/>
  <line x1="600" y1="300" x2="670" y2="330" stroke="#F97316" stroke-width="1" opacity="0.2"/>

  <!-- Abstract geometric shapes at key nodes -->
  <!-- Central hub - large hexagon -->
  <polygon points="400,155 422,168 422,193 400,205 378,193 378,168" fill="url(#heroGrad1)" opacity="0.15" stroke="url(#heroGrad1)" stroke-width="2"/>
  <circle cx="400" cy="180" r="8" fill="#7C3AED"/>

  <!-- Primary nodes - triangles and circles -->
  <polygon points="280,105 295,135 265,135" fill="none" stroke="#1E1B4B" stroke-width="2" opacity="0.6"/>
  <circle cx="280" cy="120" r="5" fill="#1E1B4B"/>

  <rect x="510" y="90" width="20" height="20" rx="3" fill="none" stroke="#7C3AED" stroke-width="2" opacity="0.6" transform="rotate(15 520 100)"/>
  <circle cx="520" cy="100" r="5" fill="#7C3AED"/>

  <polygon points="340,265 355,295 325,295" fill="none" stroke="#06B6D4" stroke-width="2" opacity="0.6"/>
  <circle cx="340" cy="280" r="5" fill="#06B6D4"/>

  <circle cx="500" cy="260" r="12" fill="none" stroke="#F97316" stroke-width="2" opacity="0.5"/>
  <circle cx="500" cy="260" r="5" fill="#F97316"/>

  <!-- Secondary nodes -->
  <circle cx="180" cy="160" r="4" fill="#1E1B4B" opacity="0.5"/>
  <circle cx="620" cy="140" r="4" fill="#7C3AED" opacity="0.5"/>
  <circle cx="240" cy="320" r="4" fill="#06B6D4" opacity="0.5"/>
  <circle cx="600" cy="300" r="4" fill="#F97316" opacity="0.5"/>

  <!-- Tertiary nodes -->
  <circle cx="120" cy="220" r="3" fill="#06B6D4" opacity="0.3"/>
  <circle cx="680" cy="200" r="3" fill="#06B6D4" opacity="0.3"/>
  <circle cx="180" cy="350" r="3" fill="#F97316" opacity="0.3"/>
  <circle cx="670" cy="330" r="3" fill="#F97316" opacity="0.3"/>

  <!-- Abstract person silhouettes at some nodes (geometric/minimal) -->
  <!-- Person 1 near top-left node -->
  <g transform="translate(155, 130)" opacity="0.35">
    <circle cx="0" cy="0" r="6" fill="#1E1B4B"/>
    <path d="M-8 22 Q-8 10 0 8 Q8 10 8 22" fill="#1E1B4B"/>
  </g>

  <!-- Person 2 near top-right -->
  <g transform="translate(645, 112)" opacity="0.35">
    <circle cx="0" cy="0" r="6" fill="#7C3AED"/>
    <path d="M-8 22 Q-8 10 0 8 Q8 10 8 22" fill="#7C3AED"/>
  </g>

  <!-- Person 3 near bottom-left -->
  <g transform="translate(215, 295)" opacity="0.35">
    <circle cx="0" cy="0" r="6" fill="#06B6D4"/>
    <path d="M-8 22 Q-8 10 0 8 Q8 10 8 22" fill="#06B6D4"/>
  </g>

  <!-- Person 4 near bottom-right -->
  <g transform="translate(625, 275)" opacity="0.35">
    <circle cx="0" cy="0" r="6" fill="#F97316"/>
    <path d="M-8 22 Q-8 10 0 8 Q8 10 8 22" fill="#F97316"/>
  </g>

  <!-- Floating geometric accents -->
  <rect x="80" y="80" width="18" height="18" rx="2" fill="none" stroke="#7C3AED" stroke-width="1.5" opacity="0.15" transform="rotate(30 89 89)"/>
  <polygon points="720,60 735,85 705,85" fill="none" stroke="#06B6D4" stroke-width="1.5" opacity="0.15"/>
  <circle cx="100" cy="340" r="10" fill="none" stroke="#F97316" stroke-width="1.5" opacity="0.15"/>
  <rect x="690" y="350" width="14" height="14" rx="2" fill="none" stroke="#1E1B4B" stroke-width="1.5" opacity="0.15" transform="rotate(-20 697 357)"/>

  <!-- Small floating dots / particles -->
  <circle cx="300" cy="60" r="2" fill="#7C3AED" opacity="0.2"/>
  <circle cx="450" cy="50" r="1.5" fill="#06B6D4" opacity="0.2"/>
  <circle cx="550" cy="350" r="2" fill="#F97316" opacity="0.15"/>
  <circle cx="150" cy="250" r="1.5" fill="#1E1B4B" opacity="0.15"/>
  <circle cx="700" cy="250" r="2" fill="#7C3AED" opacity="0.15"/>
  <circle cx="350" cy="350" r="1.5" fill="#06B6D4" opacity="0.15"/>
</svg>
