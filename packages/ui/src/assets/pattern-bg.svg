<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <pattern id="triPattern" x="0" y="0" width="50" height="43.3" patternUnits="userSpaceOnUse">
      <!-- Interlocking triangle grid -->
      <polygon points="25,0 50,43.3 0,43.3" stroke="#7C3AED" stroke-width="0.5" fill="none" opacity="0.04"/>
      <polygon points="0,0 50,0 25,43.3" stroke="#1E1B4B" stroke-width="0.5" fill="none" opacity="0.03"/>
      <!-- Node dots at vertices -->
      <circle cx="25" cy="0" r="1" fill="#7C3AED" opacity="0.04"/>
      <circle cx="0" cy="43.3" r="1" fill="#06B6D4" opacity="0.03"/>
      <circle cx="50" cy="43.3" r="1" fill="#1E1B4B" opacity="0.03"/>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#triPattern)"/>
</svg>
