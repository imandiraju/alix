<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <linearGradient id="aGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <!-- Stylized A: Two overlapping triangular shapes suggesting collaboration -->
  <g transform="translate(8, 6)">
    <!-- Left triangle of A -->
    <path d="M18 44 L28 8 L33 8 L43 44" stroke="url(#aGradient)" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right overlapping triangle accent -->
    <path d="M22 44 L32 12 L37 12 L47 44" stroke="url(#aGradient)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    <!-- Crossbar with interactive connection feel -->
    <path d="M21 32 L44 32" stroke="url(#aGradient)" stroke-width="4" stroke-linecap="round"/>
    <!-- Connection dot -->
    <circle cx="33" cy="14" r="2.5" fill="url(#aGradient)"/>
  </g>
  <!-- L -->
  <path d="M68 14 L68 46 L84 46" stroke="#1E1B4B" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- I -->
  <path d="M96 14 L96 46" stroke="#1E1B4B" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <!-- I dot -->
  <circle cx="96" cy="8" r="2.8" fill="#7C3AED"/>
  <!-- X -->
  <path d="M112 14 L132 46 M132 14 L112 46" stroke="#1E1B4B" stroke-width="4.5" fill="none" stroke-linecap="round"/>
</svg>
